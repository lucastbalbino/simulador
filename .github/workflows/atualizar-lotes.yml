name: Atualizar lotes do CV

on:
  schedule:
    - cron: '7 * * * *'   # de hora em hora, aos 7 minutos
  workflow_dispatch:
    inputs:
      consultar:
        description: 'Só consulta, sem gravar: ids de tabelas de preço separados por vírgula'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar-lotes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ler lotes do CV CRM
        env:
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_DOMINIO: vpa
          CVCRM_ID_EMPREENDIMENTO: '4'
          # Preferência por nome da tabela de 220x (todos os termos, separados por ponto e vírgula). Vazio = escolha automática.
          CVCRM_TABELA_PREFERIDA: 'black friday;15 anuais'
          CVCRM_CONSULTAR: ${{ github.event.inputs.consultar }}
        run: python3 scripts/sync_cv.py

      - name: Gerar a tabela de vendas
        run: |
          pip install --quiet openpyxl pillow
          python3 scripts/tabela_vendas.py

      - name: Publicar se algo mudou
        run: |
          if [ -z "$(git status --porcelain -- data/lotes.json tabela-de-vendas.xlsx)" ]; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotes.json tabela-de-vendas.xlsx
          git commit -m "Atualiza lotes do Sweet Village a partir do CV"
          git push
