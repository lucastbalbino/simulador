name: Atualizar lotes do CV

on:
  schedule:
    - cron: '7 * * * *'   # de hora em hora, aos 7 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-lotes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ler lotes do CV CRM
        env:
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_DOMINIO: vpa
          CVCRM_ID_EMPREENDIMENTO: '4'
        run: python3 scripts/sync_cv.py

      - name: Publicar se a tabela mudou
        run: |
          if [ -z "$(git status --porcelain -- data/lotes.json)" ]; then
            echo "Nada para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotes.json
          git commit -m "Atualiza lotes do Sweet Village a partir do CV"
          git push
