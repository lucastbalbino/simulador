name: Diagnóstico do CV (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Investigar onde está o preço dos lotes
        env:
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CVCRM_DOMINIO: vpa
          CVCRM_ID_EMPREENDIMENTO: '4'
        run: python3 scripts/diagnostico_cv.py
